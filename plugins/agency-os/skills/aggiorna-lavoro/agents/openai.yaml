interface:
  display_name: "Aggiorna lavoro"
  short_description: "Chiude la sessione, aggiorna il vault e prepara il lotto per Agency OS"
  default_prompt: "Usa $aggiorna-lavoro per aggiornare il lavoro svolto e preparare la riconciliazione con Agency OS."
dependencies:
  tools:
    - type: "mcp"
      value: "agency-os"
      description: "Lettura di Agency OS e preparazione del lotto da approvare a parte"
      transport: "streamable_http"
      url: "https://agency-os.it/mcp"
policy:
  allow_implicit_invocation: true
